mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    name: "New User",
    phone: "1234567890",
    role: "customer"
  })
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {name: "Updated Name"})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    name
    phone
    role
  }
}

query ListUsers @auth(level: USER) {
  users {
    name
    role
  }
}

mutation CreateStore @auth(level: PUBLIC, insecureReason: "Stores are public entities.") {
  store_insert(data: {
    name: "General Store",
    location: "Downtown",
    contactEmail: "store@example.com"
  })
}

mutation UpdateStore($id: UUID!) @auth(level: PUBLIC, insecureReason: "Stores allow public updates.") {
  store_update(id: $id, data: {operatingHours: "9am-5pm"})
}

mutation DeleteStore($id: UUID!) @auth(level: PUBLIC, insecureReason: "Stores allow public deletion.") {
  store_delete(id: $id)
}

query GetStore($id: UUID!) @auth(level: PUBLIC, insecureReason: "Store data is public.") {
  store(id: $id) {
    name
    location
  }
}

query ListStores @auth(level: PUBLIC, insecureReason: "Store listing is public.") {
  stores {
    name
    location
  }
}

mutation CreateProduct($storeId: UUID!) @auth(level: PUBLIC, insecureReason: "Products are public.") {
  product_insert(data: {
    name: "Gadget",
    price: 19.99,
    stockQuantity: 100,
    storeId: $storeId
  })
}

mutation UpdateProduct($id: UUID!) @auth(level: PUBLIC, insecureReason: "Products allow public updates.") {
  product_update(id: $id, data: {price: 14.99})
}

mutation DeleteProduct($id: UUID!) @auth(level: PUBLIC, insecureReason: "Products allow public deletion.") {
  product_delete(id: $id)
}

query GetProduct($id: UUID!) @auth(level: PUBLIC, insecureReason: "Product details are public.") {
  product(id: $id) {
    name
    price
  }
}

query ListProducts @auth(level: PUBLIC, insecureReason: "Product lists are public.") {
  products {
    name
    price
  }
}

mutation CreateOrder($storeId: UUID!) @auth(level: USER) {
  order_insert(data: {
    customerId_expr: "auth.uid",
    storeId: $storeId,
    status: "PENDING",
    totalAmount: 50.0,
    createdAt_expr: "request.time"
  })
}

mutation UpdateOrder($id: UUID!) @auth(level: USER) {
  order_update(id: $id, data: {status: "SHIPPED"})
}

mutation DeleteOrder($id: UUID!) @auth(level: USER) {
  order_delete(id: $id)
}

query GetOrder($id: UUID!) @auth(level: USER) {
  order(id: $id) {
    status
    totalAmount
    customer { id }
  }
}

query ListMyOrders @auth(level: USER) {
  orders(where: {customerId: {eq_expr: "auth.uid"}}) {
    id
    status
    totalAmount
  }
}

mutation CreateOrderItem($orderId: UUID!, $productId: UUID!) @auth(level: USER) {
  orderItem_insert(data: {
    orderId: $orderId,
    productId: $productId,
    quantity: 1,
    priceAtPurchase: 19.99
  })
}

mutation UpdateOrderItem($id: UUID!) @auth(level: USER) {
  orderItem_update(id: $id, data: {quantity: 2})
}

mutation DeleteOrderItem($id: UUID!) @auth(level: USER) {
  orderItem_delete(id: $id)
}

query GetOrderItem($id: UUID!) @auth(level: USER) {
  orderItem(id: $id) {
    quantity
    priceAtPurchase
  }
}

query ListOrderItems @auth(level: USER) {
  orderItems {
    quantity
    product { name }
  }
}

mutation CreateDelivery($orderId: UUID!) @auth(level: USER) {
  delivery_insert(data: {
    orderId: $orderId,
    status: "PREPARING",
    currentLocation: "Warehouse"
  })
}

mutation UpdateDelivery($id: UUID!) @auth(level: USER) {
  delivery_update(id: $id, data: {status: "EN_ROUTE"})
}

mutation DeleteDelivery($id: UUID!) @auth(level: USER) {
  delivery_delete(id: $id)
}

query GetDelivery($id: UUID!) @auth(level: USER) {
  delivery(id: $id) {
    status
    currentLocation
  }
}

query ListDeliveries @auth(level: USER) {
  deliveries {
    status
    order { id }
  }
}